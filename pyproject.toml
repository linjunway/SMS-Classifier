[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smsclf"
version = "1.0.0"
description = "Three-class SMS classifier (Normal / Spam / Smishing) served with FastAPI"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn==1.8.0",
    "pandas==3.0.2",
    "numpy",
    "joblib==1.5.3",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "matplotlib", "ruff"]
app = ["streamlit==1.65.0", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
