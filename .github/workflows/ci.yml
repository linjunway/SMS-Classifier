name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (trains the model during build)
        run: docker build -t sms-classifier-api .
      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 8000:8000 sms-classifier-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"text":"WIN a free prize now at http://bit.ly/x"}'
